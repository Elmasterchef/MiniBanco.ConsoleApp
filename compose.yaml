
services:
  postgres:
    image: postgres:17
    container_name: minibanco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minibanco
      POSTGRES_USER: minibanco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - minibanco_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibanco_user -d minibanco"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  - minibanco_data:/var/lib/postgresql/data
  - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
